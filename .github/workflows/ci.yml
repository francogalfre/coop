name: ci

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    js:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.2.17
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run build
            - run: bun run test

    go:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                module: [apps/relay, packages/cli]
        defaults:
            run:
                working-directory: ${{ matrix.module }}
        env:
            TEST_DATABASE_ADMIN_URL: postgres://postgres:password@localhost:5432/postgres
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: ${{ matrix.module }}/go.mod
                  cache-dependency-path: ${{ matrix.module }}/go.sum
            - name: gofmt
              run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
            - run: go vet ./...
            - run: go test -race ./...
