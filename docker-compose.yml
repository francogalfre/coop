services:
  relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    # The relay keeps several in-memory singletons (Store, Mailbox,
    # PresenceHub, TakeoverRegistry, PtyHub, SteerRequestRegistry — see
    # apps/relay/cmd/relay/main.go). It is strictly single-instance:
    # never raise this beyond 1 replica.
    restart: unless-stopped
    environment:
      COOP_RELAY_ADDR: ":8787"
      DATABASE_URL: ${DATABASE_URL}
      COOP_WEB_ORIGINS: https://${COOP_DOMAIN}
      COOP_GITHUB_CLIENT_ID: ${COOP_GITHUB_CLIENT_ID}
      COOP_GITHUB_CLIENT_SECRET: ${COOP_GITHUB_CLIENT_SECRET}
      COOP_INTERNAL_SECRET: ${COOP_INTERNAL_SECRET}
      COOP_WEB_INTERNAL_URL: http://web:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      # Coolify proxies compose services through its managed Traefik
      # instance and reads these labels directly — no separate proxy
      # container needed. web and relay must share COOP_DOMAIN (path-routed,
      # not subdomains): the relay's session cookie is host-only, not
      # Domain=.${COOP_DOMAIN} (see apps/web/lib/auth/auth.ts), so it's
      # only ever sent to the exact origin the browser signed in on.
      # Verify entrypoint/certresolver names in Coolify's dashboard
      # (Servers → Proxy → Configuration) if they differ on your instance.
      - traefik.enable=true
      - traefik.http.routers.coop-relay.rule=Host(`${COOP_DOMAIN}`) && (PathPrefix(`/v1`) || Path(`/healthz`))
      - traefik.http.routers.coop-relay.priority=10
      - traefik.http.routers.coop-relay.entrypoints=https
      - traefik.http.routers.coop-relay.tls=true
      - traefik.http.routers.coop-relay.tls.certresolver=letsencrypt
      - traefik.http.services.coop-relay.loadbalancer.server.port=8787

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_COOP_RELAY_URL: https://${COOP_DOMAIN}
        NEXT_PUBLIC_BETTER_AUTH_URL: https://${COOP_DOMAIN}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COOP_GITHUB_CLIENT_ID: ${COOP_GITHUB_CLIENT_ID}
      COOP_GITHUB_CLIENT_SECRET: ${COOP_GITHUB_CLIENT_SECRET}
      COOP_INTERNAL_SECRET: ${COOP_INTERNAL_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${COOP_DOMAIN}
      NEXT_PUBLIC_BETTER_AUTH_URL: https://${COOP_DOMAIN}
      NEXT_PUBLIC_COOP_RELAY_URL: https://${COOP_DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.coop-web.rule=Host(`${COOP_DOMAIN}`)
      - traefik.http.routers.coop-web.priority=1
      - traefik.http.routers.coop-web.entrypoints=https
      - traefik.http.routers.coop-web.tls=true
      - traefik.http.routers.coop-web.tls.certresolver=letsencrypt
      - traefik.http.services.coop-web.loadbalancer.server.port=3000
